name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and local HTTPS tests
        run: python -m unittest discover -s tests -v
      - name: Python and installer syntax
        run: |
          python -m py_compile server.py engine.py scan_dmit_cf_fallback.py manage.py
          bash -n install.sh
          node --check static/app.js
